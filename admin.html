  <title>پنل مدیریت — Studio M</title>
  <script>
  (function () {
    // Classic admin is deprecated — always prefer Studio M Pro.
    // Escape hatch: ?classic=1 AND SignedProof session key only (no legacy flag in early gate).
    if (/[?&]classic=1(?:&|$)/.test(location.search)) {
      try {
        if (sessionStorage.getItem('sm_classic_unlock')) return
      } catch (e) { /* */ }
    }
    location.replace('studio-m/' + (location.hash || ''))
  })()
  </script>
  <script>try{var raw=localStorage.getItem('studio_db_v5');if(raw){var d=JSON.parse(raw);if(d.studioInfo&&d.studioInfo.name)document.title='پنل مدیریت — '+d.studioInfo.name}}catch(e){}</script>
