<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Studio M — ورود ابر</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f5f5f7; color: #1d1d1f; }
    .box { text-align: center; padding: 24px; max-width: 440px; line-height: 1.7; }
    .err { color: #b42318; font-size: 0.9rem; }
    .hint { color: #6e6e73; font-size: 0.82rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <p id="msg">در حال تکمیل ورود Google / ابر...</p>
    <p id="err" class="err" hidden></p>
    <p id="hint" class="hint" hidden></p>
  </div>
  <script type="module">
    import { createClient } from '@supabase/supabase-js'

    async function main() {
      const msg = document.getElementById('msg')
      const errEl = document.getElementById('err')
      const hintEl = document.getElementById('hint')
      let appUrl = '/studio-m/index.html#settings'
      try {
        appUrl = sessionStorage.getItem('sm_oauth_return') || appUrl
      } catch { /* */ }

      function fail(text, hint) {
        msg.hidden = true
        errEl.hidden = false
        errEl.textContent = text
        if (hint) {
          hintEl.hidden = false
          hintEl.textContent = hint
        }
      }

      const url = String(import.meta.env.VITE_SUPABASE_URL || '').replace(/\/+$/, '')
      const anonKey = String(import.meta.env.VITE_SUPABASE_ANON_KEY || '').trim()
      const hash = window.location.hash || ''
      const params = new URLSearchParams(window.location.search)
      const queryErr = params.get('error_description') || params.get('error')

      if (queryErr) {
        fail(
          decodeURIComponent(queryErr.replace(/\+/g, ' ')),
          'Google provider یا Redirect URL را در Supabase / Google Cloud بررسی کنید.'
        )
        return
      }

      if (hash.includes('error=')) {
        fail('ورود Google ناموفق بود', hash.slice(0, 200))
        return
      }

      // Implicit flow: pass hash to app so supabase-js can detectSessionInUrl
      if (hash.includes('access_token')) {
        window.location.replace('/studio-m/index.html#settings')
        return
      }

      const code = params.get('code')
      if (code) {
        if (!url || !anonKey) {
          fail(
            'پیکربندی Supabase یافت نشد',
            'VITE_SUPABASE_URL و VITE_SUPABASE_ANON_KEY باید هنگام build تنظیم شوند.'
          )
          return
        }
        const client = createClient(url, anonKey, {
          auth: { persistSession: true, storageKey: 'sm_supabase_auth', detectSessionInUrl: true }
        })
        const { error } = await client.auth.exchangeCodeForSession(code)
        if (error) {
          fail(
            error.message,
            `Redirect باید شامل ${location.origin}/studio-m/auth-callback.html باشد.`
          )
          return
        }
        window.location.replace(appUrl)
        return
      }

      window.location.replace(appUrl)
    }

    main().catch((e) => {
      document.getElementById('msg').hidden = true
      const errEl = document.getElementById('err')
      errEl.hidden = false
      errEl.textContent = e?.message || String(e)
    })
  </script>
</body>
</html>
