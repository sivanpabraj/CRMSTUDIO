map $uri $studio_cache_control {
    default "no-cache";
    ~*(?:^|/)(?:sw\.js|health\.json|version\.json|manifest\.json|offline-assets\.json)$ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\.(?:png|jpg|jpeg|gif|ico|svg|woff2?)$ "public, max-age=86400";
}

log_format studio_json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
  '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index site.html;
    access_log /var/log/nginx/access.log studio_json;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 1m;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/studio-security.conf;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Deny inline scripts on every route. Inline style remains temporary P1 debt.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://gfzfmecglamyxevvttji.supabase.co wss://gfzfmecglamyxevvttji.supabase.co; upgrade-insecure-requests" always;

    location = /health.json {
        default_type application/json;
        try_files $uri =503;
    }

    location ~ ^/(?:site|contract|admin)\.html$ {
        include /etc/nginx/snippets/studio-security.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://gfzfmecglamyxevvttji.supabase.co wss://gfzfmecglamyxevvttji.supabase.co; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    # Authentication and customer shells have no inline script and do not need
    # the legacy public-page script exception.
    location ~ ^/(?:index|start|join|customer|customer-login)\.html$ {
        include /etc/nginx/snippets/studio-security.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://gfzfmecglamyxevvttji.supabase.co wss://gfzfmecglamyxevvttji.supabase.co; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    # Pro shell — delegated actions run under a script-src 'self' policy.
    # style-src still allows unsafe-inline for CSS custom props / dynamic layout styles.
    location ^~ /studio-m/ {
        index index.html;
        include /etc/nginx/snippets/studio-security.conf;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://gfzfmecglamyxevvttji.supabase.co wss://gfzfmecglamyxevvttji.supabase.co; upgrade-insecure-requests" always;
        try_files $uri $uri/ /studio-m/index.html;
    }

    location / {
        try_files $uri $uri/ /site.html;
    }

}
