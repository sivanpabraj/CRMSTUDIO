server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index site.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # script-src still allows 'unsafe-inline' for classic admin.html / legacy pages.
    # Pro shell (studio-m/js) has zero inline handlers — verified by tests/inline-handler-ban.test.js.
    # Drop unsafe-inline globally only after classic admin is retired.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; upgrade-insecure-requests" always;

    location = /health.json {
        default_type application/json;
        return 200 '{"status":"ok","service":"studio-m"}';
    }

    location / {
        try_files $uri $uri/ /site.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
