name: Operations integrity

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DEPLOYMENT_HEALTH_URL: ${{ secrets.DEPLOYMENT_HEALTH_URL }}
      DEPLOYMENT_APP_URL: ${{ secrets.DEPLOYMENT_APP_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify database invariants
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL is required"; exit 1; }
          psql "$SUPABASE_DB_URL" --no-psqlrc --file scripts/ops-integrity.sql
      - name: Verify deployed health endpoint
        run: |
          test -n "$DEPLOYMENT_HEALTH_URL" || { echo "::error::DEPLOYMENT_HEALTH_URL is required"; exit 1; }
          curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_HEALTH_URL"
      - name: Verify deployed application and security headers
        run: |
          test -n "$DEPLOYMENT_APP_URL" || { echo "::error::DEPLOYMENT_APP_URL is required"; exit 1; }
          node scripts/network-preflight.mjs
          node scripts/deployment-security-smoke.mjs
