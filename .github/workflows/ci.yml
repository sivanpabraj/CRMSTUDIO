name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - name: Playwright smoke + gated finance auth
        run: npx playwright install --with-deps chromium && npx playwright test
        # finance-auth.spec.js skips unless E2E_LOGIN_PHONE + E2E_LOGIN_PASSWORD are set
        # Uses built dist via `vite preview` (build step above)
        env:
          E2E_LOGIN_PHONE: ${{ secrets.E2E_LOGIN_PHONE }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}

      - name: Docker build
        run: docker build -t studio-m:ci .
