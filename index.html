  <title>ورود</title>
  <script>
    function purgeStuckLoader() {
      var l = document.getElementById('talar-loader');
      if (l && (l.innerText.indexOf('6.1.0') !== -1 || l.innerText.indexOf('Studio ERP') !== -1)) l.remove();
    }
    document.addEventListener('DOMContentLoaded', purgeStuckLoader);
    setTimeout(purgeStuckLoader, 200);
  </script>
  <script src="js/title-bootstrap.js"></script>
  <script>
    window.Portal = window.Portal || {
      state: { authTab: 'login', step: 'login', loginMethod: 'password', _phone: '' },
      setAuthTab: function(tab) {
        this.state.authTab = tab; this.state.step = 'login';
        var loginView = document.getElementById('auth-login-view');
        var regView = document.getElementById('auth-register-view');
        if (tab === 'register') { if (loginView) loginView.style.display = 'none'; if (regView) regView.style.display = 'block'; }
        else { if (regView) regView.style.display = 'none'; if (loginView) loginView.style.display = 'block'; }
        if (window.Portal._appLoaded && typeof window.Portal.renderAuth === 'function') window.Portal.setAuthTab(tab);
      },
      setLoginMethod: function(m) { this.state.loginMethod = m; },
      togglePasswordVisibility: function(id, iconId) {
        var inp = document.getElementById(id); var ico = document.getElementById(iconId);
        if (inp) { var isPw = inp.type === 'password'; inp.type = isPw ? 'text' : 'password'; if (ico) ico.className = isPw ? 'fas fa-eye-slash' : 'fas fa-eye'; }
      },
      loginPassword: function() { if (window.Portal._appLoaded) return window.Portal.loginPassword(); },
      submitRegister: function() { if (window.Portal._appLoaded) return window.Portal.submitRegister(); },
      submitPasswordLogin: function() { return this.loginPassword(); },
      showForgotPassword: function() { if (window.Portal._appLoaded && window.Portal.showForgotPassword !== this.showForgotPassword) return window.Portal.showForgotPassword(); }
    };
  </script>

<body class="auth-screen">
  <div id="portal-app">
    <div class="auth-page auth-page--cinema">
      <div class="auth-cinema-container">
        <div class="auth-cinema-form-wrap" id="auth-card-wrap">
          <div class="auth-card glass-panel auth-cinema-card">
            <div style="text-align:center;margin-bottom:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
              <a href="landing.html" style="display:inline-flex;align-items:center;gap:6px;font-size:0.76rem;color:#10b981;text-decoration:none;background:rgba(16,185,129,0.1);padding:4px 12px;border-radius:999px;border:1px solid rgba(16,185,129,0.25);"><i class="fas fa-sparkles"></i> معرفی امکانات و شروع رایگان</a>
              <a href="booking.html" style="display:inline-flex;align-items:center;gap:6px;font-size:0.76rem;color:#f59e0b;text-decoration:none;background:rgba(245,158,11,0.1);padding:4px 12px;border-radius:999px;border:1px solid rgba(245,158,11,0.25);"><i class="fas fa-calendar-check"></i> رزرو آنلاین نوبت</a>
            </div>
            <div class="auth-cinema-head">
              <h2 class="auth-cinema-title" id="auth-title-text">ورود</h2>
              <p class="auth-cinema-sub" id="auth-sub-text">موبایل · رمز · کد دعوت</p>
            </div>
            <div class="auth-method-tabs" style="margin-bottom:16px">
              <button type="button" id="tab-btn-login" class="auth-method-tab auth-method-tab--active" onclick="Portal.setAuthTab('login')">ورود</button>
              <button type="button" id="tab-btn-register" class="auth-method-tab" onclick="Portal.setAuthTab('register')">ثبت‌نام استودیو</button>
            </div>
            <div id="auth-login-view" class="auth-form"><p style="opacity:.6;font-size:12px">بارگذاری…</p></div>
            <div id="auth-register-view" class="auth-form" style="display:none">
              <div class="auth-grid-2col">
                <div class="auth-field">
                  <label class="auth-label" for="reg-studio-name">نام استودیو / آتلیه</label>
                  <div class="auth-input-wrap">
                    <i class="fas fa-store"></i>
                    <input type="text" id="reg-studio-name" placeholder="مثلاً استودیو ماندگار"/>
                  </div>
                </div>
                <div class="auth-field">
                  <label class="auth-label" for="reg-manager-name">نام و نام خانوادگی مدیر</label>
                  <div class="auth-input-wrap">
                    <i class="fas fa-user-tie"></i>
                    <input type="text" id="reg-manager-name" placeholder="مثلاً علی محمدی"/>
                  </div>
                </div>
              </div>

              <div class="auth-grid-2col">
                <div class="auth-field">
                  <label class="auth-label" for="reg-phone">شماره همراه مدیر (جهت ورود)</label>
                  <div class="auth-input-wrap">
                    <i class="fas fa-mobile-alt"></i>
                    <input type="tel" id="reg-phone" class="ltr" dir="ltr" inputmode="numeric" placeholder="09121234567"/>
                  </div>
                </div>
                <div class="auth-field">
                  <label class="auth-label" for="reg-email">ایمیل مدیر <span style="color:#f59e0b;font-size:11px">(الزامی جهت بکاپ و ورود)</span></label>
                  <div class="auth-input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reg-email" class="ltr" dir="ltr" placeholder="name@gmail.com" required/>
                  </div>
                </div>
              </div>

              <div class="auth-grid-2col">
                <div class="auth-field">
                  <label class="auth-label" for="reg-password">رمز عبور مدیر</label>
                  <div class="auth-input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" class="ltr" dir="ltr" lang="en" autocomplete="new-password" placeholder="حداقل ۶ کاراکتر"/>
                  </div>
                </div>
                <div class="auth-field">
                  <label class="auth-label" for="reg-password-confirm">تکرار رمز عبور</label>
                  <div class="auth-input-wrap">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" id="reg-password-confirm" class="ltr" dir="ltr" lang="en" autocomplete="new-password" placeholder="تکرار رمز عبور"/>
                  </div>
                </div>
              </div>
              <div class="auth-error" id="reg-error"></div>
              <button type="button" class="auth-btn auth-btn-primary" id="reg-btn" onclick="Portal.submitRegister()" style="margin-top:6px">
                <i class="fas fa-rocket"></i> ساخت و ثبت استودیو
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
