  <title>ورود</title>
  <script>
    function purgeStuckLoader() {
      var l = document.getElementById('talar-loader');
      if (l && (l.innerText.indexOf('6.1.0') !== -1 || l.innerText.indexOf('Studio ERP') !== -1)) {
        l.remove();
      }
    }
    document.addEventListener('DOMContentLoaded', purgeStuckLoader);
    setTimeout(purgeStuckLoader, 200);
    setTimeout(purgeStuckLoader, 1000);
  </script>
  <script src="js/title-bootstrap.js"></script>
  <script>
    window.Portal = window.Portal || {
      state: { authTab: 'login', step: 'login', loginMethod: 'password', _phone: '' },
      setAuthTab: function(tab) {
        this.state.authTab = tab;
        this.state.step = 'login';
        var loginView = document.getElementById('auth-login-view');
        var regView = document.getElementById('auth-register-view');
        var tabLogin = document.getElementById('tab-btn-login');
        var tabReg = document.getElementById('tab-btn-register');
        var wrap = document.getElementById('auth-card-wrap');
        var subEl = document.getElementById('auth-sub-text');
        if (tab === 'register') {
          if (loginView) loginView.style.display = 'none';
          if (regView) regView.style.display = 'block';
          if (tabLogin) tabLogin.className = 'auth-method-tab auth-cinema-tab';
          if (tabReg) tabReg.className = 'auth-method-tab auth-cinema-tab auth-method-tab--active';
          if (wrap) wrap.classList.add('auth-unified-wrap--wide');
          if (subEl) subEl.textContent = 'اطلاعات استودیو و مدیر را برای ساخت پنل وارد کنید';
          try { history.replaceState(null, '', '?tab=register'); } catch(e) {}
        } else {
          if (regView) regView.style.display = 'none';
          if (loginView) loginView.style.display = 'block';
          if (tabReg) tabReg.className = 'auth-method-tab auth-cinema-tab';
          if (tabLogin) tabLogin.className = 'auth-method-tab auth-cinema-tab auth-method-tab--active';
          if (wrap) wrap.classList.remove('auth-unified-wrap--wide');
          if (subEl) subEl.textContent = 'شماره موبایل و رمز عبور خود را وارد کنید';
          try { history.replaceState(null, '', location.pathname); } catch(e) {}
        }
        if (window.Portal._appLoaded && typeof window.Portal.renderAuth === 'function') {
          window.Portal.setAuthTab(tab);
        }
      },
      setLoginMethod: function(m) {
        this.state.loginMethod = m;
        var b = document.getElementById('login-btn');
        if (b && m === 'sms') b.innerHTML = '<i class="fas fa-paper-plane"></i> ارسال کد پیامکی';
      },
      togglePasswordVisibility: function(id, iconId) {
        var inp = document.getElementById(id);
        var ico = document.getElementById(iconId);
        if (inp) {
          var isPw = inp.type === 'password';
          inp.type = isPw ? 'text' : 'password';
          if (ico) ico.className = isPw ? 'fas fa-eye-slash' : 'fas fa-eye';
        }
      },
      loginPassword: function() {
        if (window.Portal._appLoaded && typeof window.Portal.loginPassword === 'function') {
          return window.Portal.loginPassword();
        }
        var id = document.getElementById('login-identifier')?.value?.trim();
        var pw = document.getElementById('login-password')?.value;
        var err = document.getElementById('login-error');
        if (!id || !pw) {
          if (err) { err.textContent = 'شماره موبایل/ایمیل و رمز عبور را وارد کنید'; err.style.display = 'block'; }
          return;
        }
        var btn = document.getElementById('login-btn');
        if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ورود...';
      },
      submitRegister: function() {
        if (window.Portal._appLoaded && typeof window.Portal.submitRegister === 'function') {
          return window.Portal.submitRegister();
        }
        var name = document.getElementById('reg-studio-name')?.value?.trim();
        var err = document.getElementById('reg-error');
        if (!name) {
          if (err) { err.textContent = 'لطفاً نام استودیو را وارد کنید'; err.style.display = 'block'; }
          return;
        }
      },
      submitPasswordLogin: function() {
        return this.loginPassword();
      },
      showForgotPassword: function() {
        if (window.Portal._appLoaded && window.Portal.showForgotPassword !== this.showForgotPassword) {
          return window.Portal.showForgotPassword();
        }
        alert('در حال بارگذاری — چند ثانیه صبر کنید');
      }
    };

    if (location.search.includes('tab=register') || location.hash === '#register') {
      window.addEventListener('DOMContentLoaded', function() {
        window.Portal.setAuthTab('register');
      });
    }
  </script>

<body class="auth-screen">
  <div id="portal-app">
    <div class="auth-page auth-page--cinema">
      <canvas class="auth-ambient" data-auth-ambient aria-hidden="true"></canvas>
      <div class="auth-ambient-fallback" aria-hidden="true"></div>
      <div class="auth-cinema-container">
        <div class="auth-cinema-hero">
          <div class="auth-hero-badge">
            <span class="auth-hero-badge-dot"></span>
            <i class="fas fa-camera"></i>
            <span id="auth-hero-badge-text">Mandani Studio ERP</span>
          </div>
          <h1 class="auth-hero-title">اکوسیستم یکپارچه<br><span class="auth-hero-title-accent" id="auth-hero-accent-text">استودیو فیلم و عکس ماندنی</span></h1>
          <p class="auth-hero-subtitle">قرارداد دیجیتال، آفیش، حسابداری و تحویل فایل.</p>
        </div>
        <div class="auth-cinema-form-wrap" id="auth-card-wrap">
          <div class="auth-card glass-panel auth-cinema-card">
            <div class="auth-cinema-head">
              <div class="auth-cinema-logo"><i class="fas fa-camera-retro"></i></div>
              <h2 class="auth-cinema-title" id="auth-title-text">ورود به سیستم</h2>
              <p class="auth-cinema-sub" id="auth-sub-text">شماره موبایل و رمز یا کد دعوت پرسنل</p>
            </div>
            <div class="auth-method-tabs auth-cinema-tabs" style="margin-bottom:20px">
              <button type="button" id="tab-btn-login" class="auth-method-tab auth-cinema-tab auth-method-tab--active" onclick="Portal.setAuthTab('login')">
                <i class="fas fa-sign-in-alt"></i> ورود
              </button>
              <button type="button" id="tab-btn-register" class="auth-method-tab auth-cinema-tab" onclick="Portal.setAuthTab('register')">
                <i class="fas fa-user-plus"></i> ثبت‌نام استودیو
              </button>
            </div>
            <div id="auth-login-view" class="auth-form" style="display:block">
              <div class="auth-field">
                <label class="auth-label" for="login-identifier">شماره موبایل یا ایمیل</label>
                <div class="auth-input-wrap">
                  <i class="fas fa-user-circle"></i>
                  <input type="text" id="login-identifier" class="ltr" dir="ltr" autocomplete="username" placeholder="0912..." autofocus/>
                </div>
              </div>
              <div class="auth-field">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                  <label class="auth-label" for="login-password" style="margin-bottom:0">رمز عبور</label>
                  <button type="button" class="auth-forgot-link" onclick="Portal.showForgotPassword()" style="background:none;border:none;color:#f59e0b;font-size:11.5px;cursor:pointer;padding:0">فراموشی رمز عبور؟</button>
                </div>
                <div class="auth-input-wrap">
                  <i class="fas fa-lock"></i>
                  <input type="password" id="login-password" class="ltr" dir="ltr" autocomplete="current-password" placeholder="رمز یا خالی اگر کد دعوت دارید"/>
                </div>
              </div>
              <div class="auth-error" id="login-error"></div>
              <button type="button" class="auth-btn auth-btn-primary" id="login-btn" onclick="Portal.loginPassword()">
                <i class="fas fa-sign-in-alt"></i> ورود
              </button>
            </div>
            <div id="auth-register-view" class="auth-form" style="display:none">
              <div class="auth-field">
                <label class="auth-label" for="reg-studio-name">نام استودیو</label>
                <div class="auth-input-wrap"><i class="fas fa-store"></i><input type="text" id="reg-studio-name"/></div>
              </div>
              <div class="auth-error" id="reg-error"></div>
              <button type="button" class="auth-btn auth-btn-primary" onclick="Portal.submitRegister()">ثبت استودیو</button>
            </div>
            <div class="auth-cinema-foot"><a href="/">صفحه اصلی</a> · <a href="join.html">عضویت پرسنل با کد استودیو</a></div>
          </div>
        </div>
      </div>
    </div>
