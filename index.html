<!DOCTYPE html>
<html lang="fa" dir="rtl">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0071E3"/>
  <title>ورود</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
      });
    }
    function purgeStuckLoader() {
      var l = document.getElementById('talar-loader');
      if (l && (l.innerText.indexOf('6.1.0') !== -1 || l.innerText.indexOf('Studio ERP') !== -1)) {
        l.remove();
      }
    }
    document.addEventListener('DOMContentLoaded', purgeStuckLoader);
    setTimeout(purgeStuckLoader, 200);
    setTimeout(purgeStuckLoader, 1000);
  </script>
  <script src="js/title-bootstrap.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/ui-kit.css"/>
  <link rel="stylesheet" href="css/portal.css"/>

  <script src="js/crypto-polyfill.js"></script>
</head>
<body class="auth-screen">
  <div id="portal-app">
    <div class="auth-page auth-page--unified">
      <div class="auth-ambient-fallback" aria-hidden="true"></div>
      <div class="auth-unified-wrap">
        <div class="auth-card glass-panel auth-unified-card">
          <div class="auth-unified-head">
            <div class="auth-unified-logo"><i class="fas fa-camera-retro"></i></div>
            <h1 class="auth-title">ورود به مدیریت استودیو</h1>
            <p class="auth-sub">شماره موبایل و رمز عبور خود را وارد کنید</p>
          </div>
          <div class="auth-method-tabs" style="margin-bottom:18px">
            <button type="button" class="auth-method-tab auth-method-tab--active" onclick="window.Portal &amp;&amp; Portal.setAuthTab('login')">
              <i class="fas fa-sign-in-alt"></i> ورود به سیستم
            </button>
            <button type="button" class="auth-method-tab" onclick="window.Portal &amp;&amp; Portal.setAuthTab('register')">
              <i class="fas fa-user-plus"></i> ثبت‌نام استودیو
            </button>
          </div>
          <form class="auth-form" onsubmit="event.preventDefault(); window.Portal &amp;&amp; Portal.submitPasswordLogin(event);">
            <div class="auth-field">
              <label class="auth-label" for="login-identifier">شماره موبایل یا ایمیل</label>
              <div class="auth-input-wrap">
                <input class="auth-input" id="login-identifier" type="text" autocomplete="username" placeholder="0912... یا name@gmail.com" dir="ltr" autofocus required>
                <i class="fas fa-user auth-field-icon"></i>
              </div>
            </div>
            <div class="auth-field">
              <div class="auth-field-header">
                <label class="auth-label" for="login-password">رمز عبور</label>
                <button type="button" class="auth-field-action-btn" onclick="window.Portal &amp;&amp; Portal.togglePasswordVisibility('login-password', this)" title="مشاهده رمز">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="auth-input-wrap">
                <input class="auth-input" id="login-password" type="password" autocomplete="current-password" placeholder="رمز عبور خود را وارد کنید" dir="ltr" required>
                <i class="fas fa-key auth-field-icon"></i>
              </div>
            </div>
            <button type="submit" class="auth-btn auth-btn--primary">
              <i class="fas fa-sign-in-alt"></i> ورود به پنل استودیو
            </button>
            <div class="auth-links-row" style="margin-top:14px;display:flex;justify-content:space-between;gap:8px;font-size:12px">
              <button type="button" class="auth-link-btn" onclick="window.Portal &amp;&amp; Portal.setLoginMethod('otp')" style="background:none;border:none;color:#ffb703;cursor:pointer;padding:0">
                <i class="fas fa-comment-sms"></i> ورود با پیامک یک‌بار مصرف
              </button>
              <button type="button" class="auth-link-btn" onclick="window.Portal &amp;&amp; Portal.setAuthTab('register')" style="background:none;border:none;color:#ffb703;cursor:pointer;padding:0">
                <i class="fas fa-user-plus"></i> ساخت استودیو جدید
              </button>
            </div>
          </form>
          <p class="auth-unified-foot"><a href="site.html">صفحه اصلی</a></p>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container" aria-live="polite"></div>
